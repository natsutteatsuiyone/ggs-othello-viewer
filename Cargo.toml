[package]
name = "ggs-othello-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"

[dependencies]
gpui-kit = { version = "0.7.3", features = ["gpui-fast"] }
async-channel = "2"
chrono = "0.4"
dirs = "5"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
